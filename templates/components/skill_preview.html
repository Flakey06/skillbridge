<div class="job-skill-row">
    <h4>{{ label }}</h4>
    <div class="skill-preview" data-skill-preview>
        <div class="skill-preview-items" data-skill-items>
            {% for skill in skills|slice:":3" %}<span data-skill-item>{{ skill }}{% if not forloop.last %}, {% endif %}</span>{% empty %}<span>{{ empty }}</span>{% endfor %}
        </div>
        {% if skills|length > 3 %}<span class="skill-preview-count">+{{ skills|length|add:"-3" }}</span>{% endif %}
    </div>
</div>
